name: Borrower App CI
run-name: "Borrower validation #${{ github.run_number }}"

on:
  push:
    branches: ["main", "demo"]
    paths:
      - "WestleyIdea/borrower/**"
      - "WestleyIdea/backend/**"
      - "WestleyIdea/Dockerfile"
      - ".github/workflows/borrower-ci.yml"
  pull_request:
    branches: ["main", "demo"]
    paths:
      - "WestleyIdea/borrower/**"
      - "WestleyIdea/backend/**"
      - "WestleyIdea/Dockerfile"
      - ".github/workflows/borrower-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: borrower-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  borrower:
    name: Borrower app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WestleyIdea/borrower

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WestleyIdea/borrower/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run validate

  backend:
    name: Backend syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WestleyIdea/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: WestleyIdea/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile backend
        run: python -m py_compile main.py
