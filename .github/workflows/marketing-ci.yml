name: Marketing Site CI
run-name: "Marketing validation #${{ github.run_number }}"

on:
  push:
    branches: ["main", "demo"]
    paths:
      - "WestleyIdea/marketing/**"
      - ".github/workflows/marketing-ci.yml"
  pull_request:
    branches: ["main", "demo"]
    paths:
      - "WestleyIdea/marketing/**"
      - ".github/workflows/marketing-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WestleyIdea/marketing

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: WestleyIdea/marketing/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: pnpm build
