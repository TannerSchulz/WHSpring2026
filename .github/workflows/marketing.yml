name: Marketing
run-name: "Marketing #${{ github.run_number }}"

env:
  VERSION_MAJOR: ${{ vars.VERSION_MAJOR }}
  VERSION_MINOR: ${{ vars.VERSION_MINOR }}
  VERSION_RUN_BASE: ${{ vars.VERSION_RUN_BASE }}
  AZURE_CORE_OUTPUT: none

on:
  push:
    branches: ["main", "demo"]
    paths:
      - "WestleyIdea/marketing/**"
      - ".github/workflows/marketing.yml"
  pull_request:
    branches: ["main", "demo"]
    paths:
      - "WestleyIdea/marketing/**"
      - ".github/workflows/marketing.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: marketing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: WestleyIdea/marketing/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: WestleyIdea/marketing
        run: pnpm install --frozen-lockfile

      - name: Lint marketing site
        working-directory: WestleyIdea/marketing
        run: pnpm lint

      - name: Set build version
        id: build
        shell: bash
        run: |
          if ! [[ "$VERSION_MAJOR" =~ ^[0-9]+$ && "$VERSION_MINOR" =~ ^[0-9]+$ && "$VERSION_RUN_BASE" =~ ^[0-9]+$ ]]; then
            echo "VERSION_MAJOR, VERSION_MINOR, and VERSION_RUN_BASE must be repository variables containing whole numbers."
            exit 1
          fi

          relative_build=$((GITHUB_RUN_NUMBER - VERSION_RUN_BASE))
          if (( relative_build < 0 )); then
            echo "VERSION_RUN_BASE ($VERSION_RUN_BASE) cannot exceed the current GitHub run number ($GITHUB_RUN_NUMBER)."
            exit 1
          fi

          version="${VERSION_MAJOR}.${VERSION_MINOR}.${relative_build}"
          channel="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            image="mortgageai-marketing"
            publish="false"
          else
            image="${{ secrets.ACR_LOGIN_SERVER }}/mortgageai-marketing"
            publish="true"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "### Marketing build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`$version\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Channel: \`$channel\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to Azure Container Registry
        if: steps.build.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build marketing image
        run: |
          docker build ./WestleyIdea/marketing \
            --file WestleyIdea/marketing/Dockerfile \
            --build-arg APP_VERSION=${{ steps.build.outputs.version }} \
            --tag ${{ steps.build.outputs.image }}:${{ steps.build.outputs.version }} \
            --tag ${{ steps.build.outputs.image }}:${{ steps.build.outputs.channel }}-latest

      - name: Push marketing image
        if: steps.build.outputs.publish == 'true'
        run: |
          docker push ${{ steps.build.outputs.image }}:${{ steps.build.outputs.version }}
          docker push ${{ steps.build.outputs.image }}:${{ steps.build.outputs.channel }}-latest

      - name: Update marketing latest tag
        if: steps.build.outputs.publish == 'true' && steps.build.outputs.channel == 'main'
        run: |
          docker tag ${{ steps.build.outputs.image }}:${{ steps.build.outputs.version }} ${{ steps.build.outputs.image }}:latest
          docker push ${{ steps.build.outputs.image }}:latest

      - name: Log in to Azure
        if: steps.build.outputs.publish == 'true' && steps.build.outputs.channel == 'demo'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy marketing Container App
        if: steps.build.outputs.publish == 'true' && steps.build.outputs.channel == 'demo'
        shell: bash
        env:
          CONTAINER_APP_NAME: ${{ vars.AZURE_MARKETING_CONTAINER_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_MARKETING_RESOURCE_GROUP || vars.AZURE_RESOURCE_GROUP }}
        run: |
          if [[ -z "$CONTAINER_APP_NAME" || -z "$RESOURCE_GROUP" ]]; then
            echo "Configure the marketing Container App name and Azure resource group repository variables."
            exit 1
          fi

          az config set extension.use_dynamic_install=yes_without_prompt
          revision=$(az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ steps.build.outputs.image }}:${{ steps.build.outputs.version }}" \
            --query properties.latestRevisionName \
            --output tsv)

          echo "### Marketing deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Container App: \`$CONTAINER_APP_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Revision: \`$revision\`" >> "$GITHUB_STEP_SUMMARY"
