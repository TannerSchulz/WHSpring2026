name: Docker Image CI

on:
  push:
    branches: [ "main", "demo" ]
  pull_request:
    branches: [ "main", "demo" ]

permissions:
  contents: read
  id-token: write

concurrency:
  group: mortgageai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set build version
      id: build
      shell: bash
      run: |
        echo "version=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
        echo "channel=${GITHUB_BASE_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

    - name: Login to Azure Container Registry
      run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

    - name: Build the Docker image
      run: |
        docker build ./WestleyIdea \
          --file WestleyIdea/Dockerfile \
          --build-arg APP_VERSION=${{ steps.build.outputs.version }} \
          --tag ${{ secrets.ACR_LOGIN_SERVER }}/mortgageai:${{ steps.build.outputs.version }} \
          --tag ${{ secrets.ACR_LOGIN_SERVER }}/mortgageai:${{ steps.build.outputs.channel }}-latest

    - name: Push versioned Docker image
      run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/mortgageai:${{ steps.build.outputs.version }}

    - name: Push branch channel image
      if: github.event_name == 'push'
      run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/mortgageai:${{ steps.build.outputs.channel }}-latest

    - name: Update main latest image
      if: github.event_name == 'push' && steps.build.outputs.channel == 'main'
      run: |
        docker tag ${{ secrets.ACR_LOGIN_SERVER }}/mortgageai:${{ steps.build.outputs.version }} ${{ secrets.ACR_LOGIN_SERVER }}/mortgageai:latest
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/mortgageai:latest

    - name: Log in to Azure for demo deployment
      if: github.event_name == 'push' && steps.build.outputs.channel == 'demo'
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy version to demo Container App
      if: github.event_name == 'push' && steps.build.outputs.channel == 'demo'
      shell: bash
      run: |
        az config set extension.use_dynamic_install=yes_without_prompt
        revision=$(az containerapp update \
          --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
          --image "${{ secrets.ACR_LOGIN_SERVER }}/mortgageai:${{ steps.build.outputs.version }}" \
          --query properties.latestRevisionName \
          --output tsv)

        echo "### Demo deployment" >> "$GITHUB_STEP_SUMMARY"
        echo "- Version: \`${{ steps.build.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- Container App: \`${{ vars.AZURE_CONTAINER_APP_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- Revision: \`${revision}\`" >> "$GITHUB_STEP_SUMMARY"
